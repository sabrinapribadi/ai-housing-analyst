name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      # unit tests need no data files or API key; the live hallucination suite runs locally (tests/test_hallucination.py)
      - run: pip install pandas numpy scikit-learn matplotlib folium pytest ruff
      - run: ruff check --select E9,F63,F7,F82 src scripts tests
      - run: python -m pytest -q tests/test_clustering_unit.py
