# At-a-glance brief (rule R22). Edit here only; `python scripts/brief.py` writes it into README.md and the pages.
repo_url: https://github.com/sabrinapribadi/ai-housing-analyst
brief:
  - w: What
    lines:
      - "An analytics and AI app for the Tokyo Airbnb market: dashboards, maps, a chat agent and search over guest reviews."
  - w: Why
    lines:
      - Hosts and analysts want prices, gaps and guest sentiment by neighbourhood without writing queries.
  - w: Who
    lines:
      - "Users: hosts, investors and market analysts."
      - "Data: Inside Airbnb Tokyo, 27,945 listings and 444,182 reviews."
  - w: Where
    lines:
      - "[Results page](https://sabrinapribadi.github.io/ai-housing-analyst/) and [technical walkthrough](https://sabrinapribadi.github.io/ai-housing-analyst/build.html) on GitHub Pages."
      - The Streamlit app runs locally with an OpenAI key.
  - w: When it fails
    lines:
      - "A hallucination suite asks the live agent 6 questions and checks each number against the data: 0 hallucinations in the recorded run."
      - "Pre-registered study on 300 questions: a reranked review search lifts nDCG@10 from 0.46 to 0.55 (passed); a LoRA-tuned Qwen3-1.7B on vLLM failed all three gates against gpt-6-luna."
      - "No live A/B test: there are no users. Offline paired comparisons, two judges from different model families, and unit tests in CI replace it."
  - w: How
    lines:
      - LangChain agent with 7 tools over the listings; review answers by gpt-6-luna with a citation after each claim, chosen over gpt-4o-mini (fully grounded 78% vs 1%, 33% cheaper) and a fine-tuned small model; K-Means areas.
skills:
  - group: GenAI and agents
    what: tool-using LangChain agent, retrieval over reviews, AI-guided data merge
    proof: [["agent.py", "src/agent/agent.py"], ["rag_agent.py", "src/agent/rag_agent.py"], ["discovery_agent.py", "src/agent/discovery_agent.py"]]
  - group: Analytics and ML
    what: EDA, K-Means geospatial clusters, review sentiment
    proof: [["eda.py", "src/analytics/eda.py"], ["clustering.py", "src/analytics/clustering.py"]]
  - group: Evaluation
    what: retrieval nDCG with blind model-graded labels, two-judge grounding checks, paired bootstrap, pre-registered gates
    proof: [["ADR-008", "docs/adr/ADR-008-retrieval-evaluation.md"], ["ADR-009", "docs/adr/ADR-009-small-model-vs-api.md"], ["test_hallucination.py", "tests/test_hallucination.py"]]
  - group: Fine-tuning and serving
    what: LoRA on Qwen3-1.7B from open-teacher answers (PEFT, TRL), vLLM serving benchmark, cost per 1,000 answers
    proof: [["train_lora.py", "kaggle/lora/train_lora.py"], ["bench.py", "kaggle/bench/bench.py"], ["review_answer.py", "src/agent/review_answer.py"]]
  - group: CI
    what: GitHub Actions lint, unit and browser tests; Pages deploy only after they pass
    proof: [["ci.yml", ".github/workflows/ci.yml"]]
